schema: sat-dengue-exp02-ablation-design
version: 0.1.0
status: draft
experiment_id: EXP02
execution_authorized: false
hypothesis: Parte de la señal del canal favorece persistencia; historia y estacionalidad
  podrían conservar detección con menor complejidad.
inventory_authority: docs/product/stage-3/training_preparation_contract_v1.json
groups:
  historia:
  - dengue_notifications_count
  - dengue_grave_notifications_count
  - dengue_lag_1
  - dengue_lag_2
  - dengue_lag_3
  - grave_lag_1
  - grave_lag_2
  - dengue_cambio_1m
  - dengue_media_3m
  canal_actual:
  - zona_canal_t
  canal_historia:
  - zona_canal_lag_1
  estacionalidad:
  - mes_sin
  - mes_cos
  clima:
  - rain_mm_month_sum
  - temp_mean_c_month_mean
  - dewpoint_mean_c_month_mean
  - surface_runoff_mm_month_sum
  - total_evaporation_mm_month_sum_ecmwf
  - solar_radiation_mj_m2_month_sum
  - soil_water_l1_month_mean
  - wind_u_ms_month_mean
  - wind_v_ms_month_mean
  - lluvia_lag_1
  - lluvia_lag_2
  - temperatura_lag_1
  - temperatura_lag_2
  - rocio_lag_1
  - escorrentia_lag_1
  contexto:
  - municipality_code
variants:
- id: full
  included_groups:
  - historia
  - canal_actual
  - canal_historia
  - estacionalidad
  - clima
  - contexto
  excluded_groups: []
  rationale: Comparador completo congelado de EXP01.
  conditional: false
- id: without_current_zone
  included_groups:
  - historia
  - canal_historia
  - estacionalidad
  - clima
  - contexto
  excluded_groups:
  - canal_actual
  rationale: Retira toda la zona actual; no equivale a retirar solo EXCESO.
  conditional: false
- id: without_channel
  included_groups:
  - historia
  - estacionalidad
  - clima
  - contexto
  excluded_groups:
  - canal_actual
  - canal_historia
  rationale: Contrasta dependencia conjunta del canal.
  conditional: false
- id: history
  included_groups:
  - historia
  excluded_groups:
  - canal_actual
  - canal_historia
  - estacionalidad
  - clima
  - contexto
  rationale: Referencia epidemiológica mínima.
  conditional: false
- id: history_season
  included_groups:
  - historia
  - estacionalidad
  excluded_groups:
  - canal_actual
  - canal_historia
  - clima
  - contexto
  rationale: Incremento de estacionalidad frente a history.
  conditional: false
- id: history_climate
  included_groups:
  - historia
  - clima
  excluded_groups:
  - canal_actual
  - canal_historia
  - estacionalidad
  - contexto
  rationale: Incremento climático frente a history en idéntica cohorte; condicional
    a cobertura suficiente.
  conditional: true
comparator: PENDING_EXP01:full
pending_exp01:
  T+1: PENDING_EXP01
  T+2: PENDING_EXP01
  cohorte_operativa: PENDING_EXP01
  calendario: PENDING_EXP01
  comparador_principal: PENDING_EXP01
  calibracion: PENDING_EXP01
  umbral: PENDING_EXP01
  mlflow_parent_child: PENDING_EXP01
  presupuesto_falsas_alertas: PENDING_EXP01
  definicion_metricas: PENDING_EXP01
metrics:
- delta_sensibilidad_inicios_pareada
- precision_inicios
- episodios_detectados
- episodios_perdidos
- falsas_alertas
- falsas_alertas_municipio_anio
- razon_falsas_alertas
- anticipacion_util
- PR_AUC
- Brier
- calibracion
- cobertura
- estabilidad
- numero_variables
- complejidad
temporal_restrictions:
  '2025': consumido; prohibido para selección, ajuste, entrenamiento o confirmación
  '2024': estrés retrospectivo solamente; no selección
  confirmation: datos futuros no observados
  selection: ventanas de desarrollo anteriores al periodo evaluado
protocol_freeze: blocked_until_EXP01_interfaces_and_human_approval
prohibited:
- execution
- fits
- calibration
- threshold_selection
- protocol.json
- registry_update
