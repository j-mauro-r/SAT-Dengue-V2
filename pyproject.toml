[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-dengue-v2"
version = "0.2.0"
description = "Sistema de Alerta Temprana para Brotes de Dengue en Colombia"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kedro==1.7.0",
    "kedro-datasets==9.6.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
]


[project.optional-dependencies]
server = [
    "uvicorn>=0.32,<1",
]

dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "openpyxl==3.1.5",
]
modeling = [
    "xgboost==3.0.5",
    "scipy==1.18.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.7.2",
    "threadpoolctl==3.7.0",
    "narwhals==2.27.1",
]
notebook = [
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.4.0",
]
tracking = ["mlflow==3.17.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sat_dengue*"]
namespaces = false

[tool.kedro]
package_name = "sat_dengue"
project_name = "SAT-Dengue-V2"
kedro_init_version = "1.7.0"
source_dir = "src"

[tool.setuptools.package-data]
"scripts.read_only_api" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src", "tests/integration"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["sat_dengue", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
