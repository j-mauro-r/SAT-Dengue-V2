[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-dengue-v2"
version = "0.1.0"
description = "Sistema de Alerta Temprana para Brotes de Dengue en Colombia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
server = [
    "uvicorn>=0.32,<1",
]

dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "numpy>=2.0",
    "pandas>=2.2",
]

notebook = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools]
packages = ["scripts.read_only_api"]
include-package-data = false

[tool.setuptools.package-data]
"scripts.read_only_api" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
