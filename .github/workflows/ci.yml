name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    outputs:
      run_docs: ${{ steps.validation.outputs.run_docs }}
      run_dwp: ${{ steps.validation.outputs.run_dwp }}
      run_python_quality: ${{ steps.validation.outputs.run_python_quality }}
      pytest_scope: ${{ steps.validation.outputs.pytest_scope }}
      run_base_package: ${{ steps.validation.outputs.run_base_package }}
      full_gate: ${{ steps.validation.outputs.full_gate }}
      reason: ${{ steps.validation.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify validation surface
        id: validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          arguments=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE_FULL" == "true" ]]; then
            arguments+=(--force-full)
          fi
          python3 scripts/classify_validation_surface.py "${arguments[@]}"

      - name: Report validation selection
        env:
          REASON: ${{ steps.validation.outputs.reason }}
        run: echo "Validation selection — $REASON"

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f .gitignore
          test -f pyproject.toml
          test -f .github/pull_request_template.md
          test -f docs/README.md
          test -f docs/governance/ai-developer-first.md
          test -f docs/roadmap/master-plan.md

      - name: DWP conformance
        if: steps.validation.outputs.run_dwp == 'true'
        run: mkdir -p .dwp/plans && bash .agents/skills/deepworkplan/verify/conformance.sh

      - name: Documentation consistency inventory
        if: steps.validation.outputs.run_docs == 'true'
        run: |
          find docs -type f -name '*.md' | sort
          python3 scripts/check_markdown_links.py
          git diff --name-only -- docs AGENTS.md README.md .github

      - name: Check forbidden committed files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Potential secret file committed to repository."
            exit 1
          fi

      - name: Scan forbidden PITAGORAS runtime references
        run: |
          if grep -RIn "PITAGORAS" . \
            --exclude-dir=.git \
            --exclude-dir=.dwp \
            --exclude-dir=.github \
            --include='*.py' \
            --include='*.json' \
            --include='*.toml' \
            --include='*.sh'; then
            echo "Forbidden PITAGORAS runtime/config reference found."
            exit 1
          fi

      - name: Secret pattern scan
        run: |
          if grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' . \
            --exclude-dir=.git \
            --exclude=skills-lock.json; then
            echo "Potential credential pattern detected."
            exit 1
          fi

  python-quality:
    name: Python Quality
    needs: repository-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Explain skipped Python quality
        if: needs.repository-quality.outputs.run_python_quality != 'true'
        run: echo "Python quality skipped — ${{ needs.repository-quality.outputs.reason }}"

      - name: Setup Python
        if: needs.repository-quality.outputs.run_python_quality == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full development dependencies
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,modeling,tracking]"

      - name: Install scoped API development dependencies
        if: needs.repository-quality.outputs.pytest_scope == 'api'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Full Ruff lint
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        run: |
          python -m ruff check src tests scripts/read_only_api scripts/check_markdown_links.py scripts/classify_validation_surface.py scripts/dashboard_e2e_smoke.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py scripts/validate_read_only_api_wheel.py

      - name: Full Ruff format
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        run: |
          python -m ruff format --check src tests scripts/read_only_api scripts/check_markdown_links.py scripts/classify_validation_surface.py scripts/dashboard_e2e_smoke.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py scripts/validate_read_only_api_wheel.py

      - name: Full type check
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        env:
          MYPYPATH: src:tests/unit:tests/integration
        run: |
          python -m mypy --explicit-package-bases src tests scripts/read_only_api scripts/check_markdown_links.py scripts/classify_validation_surface.py scripts/dashboard_e2e_smoke.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py scripts/validate_read_only_api_wheel.py

      - name: Scoped API quality
        if: needs.repository-quality.outputs.pytest_scope == 'api'
        env:
          MYPYPATH: src:tests/unit
        run: |
          python -m ruff check scripts/read_only_api scripts/dashboard_e2e_smoke.py tests/unit/test_dashboard_query_service.py tests/unit/test_read_only_api_http.py tests/unit/test_read_only_api_contract.py
          python -m ruff format --check scripts/read_only_api scripts/dashboard_e2e_smoke.py tests/unit/test_dashboard_query_service.py tests/unit/test_read_only_api_http.py tests/unit/test_read_only_api_contract.py
          python -m mypy --explicit-package-bases scripts/read_only_api scripts/dashboard_e2e_smoke.py tests/unit/test_dashboard_query_service.py tests/unit/test_read_only_api_http.py tests/unit/test_read_only_api_contract.py

  unit-tests:
    name: Unit Tests
    needs: repository-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Explain skipped Python tests
        if: needs.repository-quality.outputs.pytest_scope == 'none'
        run: echo "Python tests skipped — ${{ needs.repository-quality.outputs.reason }}"

      - name: Setup Python
        if: needs.repository-quality.outputs.pytest_scope != 'none'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full test dependencies
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,modeling,tracking]"

      - name: Install scoped API test dependencies
        if: needs.repository-quality.outputs.pytest_scope == 'api'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run units, contracts including test_repository_disposition.py, and synthetic E2E
        if: needs.repository-quality.outputs.pytest_scope == 'full'
        run: KEDRO_DISABLE_TELEMETRY=yes pytest tests/unit tests/contracts tests/integration/test_migration_parity.py tests/integration/test_mlflow_tracking.py tests/integration/test_kedro_e2e.py tests/integration/test_exp03_input_integration.py tests/integration/test_exp03_tracking.py -v

      - name: Run Stage 7 API contract tests
        if: needs.repository-quality.outputs.pytest_scope == 'api'
        run: pytest tests/unit/test_dashboard_query_service.py tests/unit/test_read_only_api_http.py tests/unit/test_read_only_api_contract.py -q

  base-package:
    name: Base wheel without optional dependencies
    needs: repository-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Explain skipped base package validation
        if: needs.repository-quality.outputs.run_base_package != 'true'
        run: echo "Base package validation skipped — ${{ needs.repository-quality.outputs.reason }}"

      - name: Setup Python
        if: needs.repository-quality.outputs.run_base_package == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install base wheel
        if: needs.repository-quality.outputs.run_base_package == 'true'
        run: |
          python -m pip wheel --no-deps . -w tmp/ci-wheels
          python -m pip install tmp/ci-wheels/*.whl
          python -m pip check

      - name: Verify optional roots absent and run base bootstrap
        if: needs.repository-quality.outputs.run_base_package == 'true'
        env:
          KEDRO_DISABLE_TELEMETRY: "yes"
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('sklearn','lightgbm','xgboost','scipy','threadpoolctl','narwhals','mlflow'))"
          python tests/integration/base_bootstrap.py

      - name: Verify installed read-only API wheel
        if: needs.repository-quality.outputs.run_base_package == 'true'
        run: python scripts/validate_read_only_api_wheel.py tmp/ci-wheels/*.whl
