name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f .gitignore
          test -f .github/pull_request_template.md

      - name: Check for obvious committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "Potential secret file committed to repository."
            exit 1
          fi

      - name: CI completed
        run: echo "Repository Quality PASS"