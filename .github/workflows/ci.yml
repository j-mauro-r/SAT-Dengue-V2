name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f .gitignore
          test -f pyproject.toml
          test -f .github/pull_request_template.md
          test -f docs/README.md
          test -f docs/governance/ai-developer-first.md
          test -f docs/roadmap/master-plan.md

      - name: DWP conformance
        run: mkdir -p .dwp/plans && bash .agents/skills/deepworkplan/verify/conformance.sh

      - name: Documentation consistency inventory
        run: |
          find docs -type f -name '*.md' | sort
          python3 scripts/check_markdown_links.py
          git diff --name-only -- docs AGENTS.md README.md .github || true

      - name: Check forbidden committed files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$'; then
            echo "Potential secret file committed to repository."
            exit 1
          fi

      - name: Scan forbidden PITAGORAS runtime references
        run: |
          if grep -RIn "PITAGORAS" . \
            --exclude-dir=.git \
            --exclude-dir=.dwp \
            --exclude-dir=.github \
            --include='*.py' \
            --include='*.json' \
            --include='*.toml' \
            --include='*.sh'; then
            echo "Forbidden PITAGORAS runtime/config reference found."
            exit 1
          fi

      - name: Secret pattern scan
        run: |
          if grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' . \
            --exclude-dir=.git \
            --exclude=skills-lock.json; then
            echo "Potential credential pattern detected."
            exit 1
          fi


  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,modeling,tracking]"

      - name: Ruff lint
        run: |
          python -m ruff check src tests scripts/check_markdown_links.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py

      - name: Ruff format
        run: |
          python -m ruff format --check src tests scripts/check_markdown_links.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py

      - name: Type check
        env:
          MYPYPATH: src:tests/unit:tests/integration
        run: |
          python -m mypy --explicit-package-bases src tests scripts/check_markdown_links.py scripts/export_kedro_constraints.py scripts/stage2_consolidated_dataset_pipeline.py scripts/validate_stage2_training_readiness.py scripts/stage2_notebook_visual_assets.py scripts/stage2_manifest_traceability.py


  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,modeling,tracking]"

      - name: Run units, contracts including test_repository_disposition.py, and synthetic E2E
        run: KEDRO_DISABLE_TELEMETRY=yes pytest tests/unit tests/contracts tests/integration/test_migration_parity.py tests/integration/test_mlflow_tracking.py tests/integration/test_kedro_e2e.py -v

  base-package:
    name: Base wheel without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install base wheel
        run: |
          python -m pip wheel --no-deps . -w tmp/ci-wheels
          python -m pip install tmp/ci-wheels/*.whl
          python -m pip check
      - name: Verify optional roots absent and run base bootstrap
        env:
          KEDRO_DISABLE_TELEMETRY: "yes"
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('sklearn','lightgbm','xgboost','scipy','threadpoolctl','narwhals','mlflow'))"
          python tests/integration/base_bootstrap.py
