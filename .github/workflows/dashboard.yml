name: Manual Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/dashboard/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Setup Python for API-dashboard smoke
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API server dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]"

      - name: Run real API-dashboard smoke
        working-directory: .
        run: python scripts/dashboard_e2e_smoke.py
